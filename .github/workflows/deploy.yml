name: Deploy Blog to Prose

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          PROSE_SSH_PRIVATE_KEY: ${{ secrets.PROSE_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROSE_SSH_PRIVATE_KEY" > ~/.ssh/id_prose
          chmod 600 ~/.ssh/id_prose
          ssh-keyscan -H prose.sh >> ~/.ssh/known_hosts
        shell: bash

      - name: Deploy blog content
        env:
          PROSE_USERNAME: ${{ secrets.PROSE_USERNAME }}
        run: |
          rsync -av --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'LICENSE' \
            -e 'ssh -i ~/.ssh/id_prose' \
            ./ "${PROSE_USERNAME}@prose.sh:/"
        shell: bash
