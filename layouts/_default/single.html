{{ define "main" }}
<article>
    <h1>{{ .Title }}</h1>
    <div class="post-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    </div>
    {{ with .Params.tags }}
    <div class="post-tags">
        {{ range . }}
        <a href="/tags/{{ . | urlize }}">#{{ . }}</a>
        {{ end }}
    </div>
    {{ end }}
    {{ .Content }}
</article>
{{ end }}
