<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
    <meta property="og:description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    {{ if .Params.image }}
    <meta property="og:image" content="{{ .Params.image }}">
    {{ end }}
    {{ if .Params.card }}
    <meta name="twitter:card" content="{{ .Params.card }}">
    {{ else }}
    <meta name="twitter:card" content="summary">
    {{ end }}
    
    <link rel="stylesheet" href="{{ "/style.css" | relURL }}">
</head>
<body>
    <header>
        <div class="header-content">
            <h1><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></h1>
            <form class="search-form" action="https://duckduckgo.com/" method="get" target="_blank">
                <input type="hidden" name="sites" value="martijn.vanexel.net">
                <input type="hidden" name="kp" value="-2">
                <input type="search" name="q" placeholder="Search this site..." aria-label="Search this site">
                <button type="submit" aria-label="Submit search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </form>
        </div>
    </header>
    <main>
        {{ block "main" . }}{{ end }}
    </main>
    <footer>
        <p>&copy; {{ now.Year }} {{ .Site.Title }}. I built this site with <a href="https://gohugo.io/">Hugo</a></p>
    </footer>
</body>
</html>
